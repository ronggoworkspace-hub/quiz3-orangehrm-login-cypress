name: Cypress API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cypress-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cypress-api-reqres/package-lock.json

      - name: Install dependencies
        working-directory: cypress-api-reqres
        run: npm install

      - name: Run Cypress API tests
        working-directory: cypress-api-reqres
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: npm run cy:run
